name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  accuracy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      HF_HOME: ${{ github.workspace }}/.hf-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-torch.txt --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r backend/requirements-dev.txt
      - uses: actions/cache@v4
        with:
          path: |
            experiments/models/vanguard
            .hf-cache
          key: accuracy-models-${{ runner.os }}-${{ hashFiles('backend/app/model_artifacts.py') }}
      - name: Download pinned and checksum-verified models and samples
        run: |
          python experiments/download_model.py
          PYTHONPATH=backend python -c 'from app.loader import ModelHub; ModelHub()._download_zh()'
          python scripts/prepare_benchmark.py --pairs-per-language 50 --mixed-per-language 0 --seed 20261002 --out experiments/benchmark-private/accuracy-ci
      - name: Start backend and require both models
        run: |
          python -m uvicorn app.main:app --app-dir backend --host 127.0.0.1 --port 8000 > backend-server.log 2>&1 &
          python scripts/wait_accuracy_models.py
      - name: Golden scores
        run: python -m pytest -m golden -q
        working-directory: backend
      - name: Evaluate fixed samples
        run: python backend/benchmark.py experiments/benchmark-private/accuracy-ci/manifest.jsonl --out experiments/benchmark-private/accuracy-ci/report.json
      - name: Gate false flags and misses
        run: python backend/accuracy_gate.py experiments/benchmark-private/accuracy-ci/report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accuracy-report
          path: experiments/benchmark-private/accuracy-ci/report.json
          if-no-files-found: warn

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      # CPU 版 torch 比默认的 CUDA 版小得多；默认测试不加载模型权重。
      - run: pip install -r requirements-torch.txt --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      # 冒烟测试用假模型，不需要权重；后端依赖（含 CPU 版 torch）照常装。
      - run: pip install -r backend/requirements-torch.txt --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run e2e
        working-directory: frontend
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: essay-ai-detector:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # 不加载模型（DETECTOR_SKIP_LOAD），只验证：镜像能起、前端和接口都由后端伺服、非 root。
      - name: Smoke test
        run: |
          docker run -d --name detector -p 127.0.0.1:8000:8000 -e DETECTOR_SKIP_LOAD=1 essay-ai-detector:ci
          for i in $(seq 1 60); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' detector)" = healthy ] && break
            sleep 2
          done
          docker inspect -f 'health={{.State.Health.Status}}' detector
          curl -fsS http://127.0.0.1:8000/api/health
          curl -fsS http://127.0.0.1:8000/ | grep -q 'id="root"'
          curl -fsS http://127.0.0.1:8000/api/status
          test "$(docker exec detector id -u)" = 1000
          test "$(docker inspect -f '{{.State.Health.Status}}' detector)" = healthy
      - if: failure()
        run: docker logs detector
